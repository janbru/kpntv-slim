name: Build APK

# Every push to main and every pull request builds the APK and attaches it to the run.
# Pushing a tag such as v0.10 also publishes it as a GitHub Release, which is the download link for sideloading.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create the release on tag pushes

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties is git-ignored (it can hold the developer seed and a local JDK path), so build from the
      # example without its machine-specific JDK line. The seed stays empty: the APK asks for a one-time sign-in.
      - name: Gradle properties
        run: grep -v '^org.gradle.java.home' gradle.properties.example > gradle.properties

      # The release build is signed with ~/.android/debug.keystore. Use the KEYSTORE_BASE64 secret when it is set
      # (stable signature, so a new APK installs over the old one). Otherwise generate a throwaway key; APKs built
      # that way have a new signature each run and must be uninstalled before the next one is installed.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          name="kpntv-slim-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: android/${{ steps.apk.outputs.name }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --title "$GITHUB_REF_NAME" --generate-notes
